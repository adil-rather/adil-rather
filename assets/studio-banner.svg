
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="320"
     viewBox="0 0 1200 320"
     role="img" aria-labelledby="title desc">

  <title id="title">RatherBuilds — GitHub Banner</title>
  <desc id="desc">Minimal developer brand banner with custom RB logo.</desc>

  <defs>
    <clipPath id="bannerClip">
      <rect width="1200" height="320" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">

    <!-- Background -->
    <rect width="1200" height="320" fill="#101D23"/>
    <rect x="836" width="364" height="320" fill="#B7DCC7"/>

    <!-- Brand category -->
    <rect x="76" y="58" width="26" height="3" fill="#A8DDC3"/>

    <text x="117" y="64"
          fill="#B4C8C4"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="12"
          font-weight="600"
          letter-spacing="2.5">
      DESIGN / DEVELOPMENT / OPEN SOURCE
    </text>

    <!-- Brand name -->
    <text x="72" y="169"
          fill="#F4F0E7"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="79"
          font-weight="750"
          letter-spacing="-3.8">
      RatherBuilds
    </text>

    <!-- Brand statement -->
    <text x="77" y="210"
          fill="#B4C8C4"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="19">
      Useful software. Thoughtful interfaces. Better ideas.
    </text>

    <!-- Divider -->
    <path d="M76 248H788"
          stroke="#617872"
          stroke-opacity=".56"/>

    <!-- Categories -->
    <g fill="#E8E8DE"
       font-family="Inter, Segoe UI, Arial, sans-serif"
       font-size="12"
       font-weight="600"
       letter-spacing="1.6">

      <text x="76" y="279">WEB</text>
      <text x="160" y="279">APPS</text>
      <text x="261" y="279">DATA &amp; AI</text>

    </g>

    <g fill="#A8DDC3">
      <circle cx="139" cy="275" r="2"/>
      <circle cx="240" cy="275" r="2"/>
    </g>

    <!-- GitHub handle -->
    <text x="787" y="279"
          text-anchor="end"
          fill="#87A5A0"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="12"
          letter-spacing="1">
      @adil-rather
    </text>

    <!-- Right signature panel -->
    <rect x="862" y="24"
          width="312" height="272"
          rx="3"
          fill="none"
          stroke="#1D3A34"
          stroke-opacity=".25"/>

    <text x="883" y="54"
          fill="#25483E"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="11"
          font-weight="700"
          letter-spacing="2.2">
      RB / 01
    </text>

    <!-- Precision details -->
    <path d="M1110 50h42"
          stroke="#25483E"
          stroke-width="1.5"/>
    <path d="M1141 40v20"
          stroke="#25483E"
          stroke-width="1.5"/>

    <!-- Custom geometric RB monogram -->
    <g transform="translate(922 94)"
       fill="none"
       stroke="#172C2B"
       stroke-width="13"
       stroke-linecap="square"
       stroke-linejoin="round">

      <!-- Letter R -->
      <path d="
        M0 120V0H45
        C71 0 84 13 84 36
        S71 72 45 72H0
        M43 72L88 120
      "/>

      <!-- Letter B -->
      <path d="
        M113 120V0H156
        C181 0 193 11 193 30
        S181 60 156 60H113
        M113 60H158
        C183 60 196 71 196 90
        S183 120 158 120H113
      "/>

    </g>

    <!-- Signature footer -->
    <path d="M884 242H1152"
          stroke="#25483E"
          stroke-opacity=".45"/>

    <text x="884" y="270"
          fill="#25483E"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="12"
          font-weight="700"
          letter-spacing="1.9">
      BUILT WITH INTENTION.
    </text>

    <circle cx="1150" cy="266"
            r="4"
            fill="#25483E"/>

  </g>
</svg>
